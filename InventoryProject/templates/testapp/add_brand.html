<!DOCTYPE html>
{% extends 'testapp/base.html' %}
{% block body_block %}
<style>
    .edit-page-wrapper {
        max-width: 700px;
        margin: 30px auto;
        padding: 0 20px;
    }
    .edit-page-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #2c3448;
        margin-bottom: 4px;
    }
    .edit-page-subtitle {
        font-size: 0.88rem;
        color: #8a8f9c;
        margin-bottom: 14px;
    }
    .edit-page-title-bar {
        border-bottom: 2px solid #4e73df;
        padding-bottom: 14px;
        margin-bottom: 26px;
    }
    .edit-form-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 18px 24px;
    }
    .edit-form-grid p {
        flex: 1 1 260px;
        margin: 0;
    }
    .edit-form-grid label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #3c4257;
        font-size: 0.9rem;
    }
    .edit-form-grid input[type="text"],
    .edit-form-grid input[type="number"],
    .edit-form-grid input[type="email"],
    .edit-form-grid input[type="password"],
    .edit-form-grid input[type="date"],
    .edit-form-grid input[type="file"],
    .edit-form-grid select,
    .edit-form-grid textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #c3c9d4;
        border-radius: 6px;
        font-size: 0.95rem;
        background: #fff;
        box-sizing: border-box;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .edit-form-grid input:focus,
    .edit-form-grid select:focus,
    .edit-form-grid textarea:focus {
        outline: none;
        border-color: #4e73df;
        box-shadow: 0 0 0 3px rgba(78,115,223,0.15);
    }
    .edit-form-actions {
        margin-top: 30px;
        padding-top: 18px;
        border-top: 1px solid #edf0f5;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
    }
    .edit-form-actions .btn-success {
        padding: 10px 26px;
        border-radius: 6px;
        font-weight: 600;
        border: none;
        background: #1cc88a;
        color: #fff;
        cursor: pointer;
        transition: background 0.2s;
        font-size: 0.92rem;
    }
    .edit-form-actions .btn-success:hover {
        background: #17a673;
    }
</style>
<div class="edit-page-wrapper">
    <div class="edit-page-title-bar">
        <div class="edit-page-title">Add Brand</div>
        <div class="edit-page-subtitle">Fill in the details below to add new Brand</div>
    </div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="edit-form-grid">
            {{ form.as_p }}
        </div>
        <div class="edit-form-actions">
            <input type="submit" class="btn btn-success" value="Add Brand">
        </div>
    </form>
</div>
{% endblock %}
