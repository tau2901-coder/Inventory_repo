{% extends 'testapp/base.html' %}
{% block body_block %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">UNITS</h4>
        <div>
            <a class="btn btn-success btn-sm" href="/add_unit">➕ Add UNIT</a>
        </div>
    </div>

    <div class="table-responsive shadow-sm rounded">
        <table class="table table-hover table-bordered align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th>S.No</th>
                    <th>Unit</th>
                    <th>Unit Code</th>
                <!--    <th>Username</th>  -->
                    <th class="text-center" style="width: 140px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for o in obj %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ o.unit }}</td>
                    <td>{{ o.unit_code }}</td>
                   <!-- <td>{{ o.username }}</td>  -->
                    <td class="text-center">
                        <a href="/edit_unit/{{ o.id }}" class="btn btn-outline-secondary btn-sm" title="Edit">📝</a>
                        &nbsp;<a class="btn btn-danger btn-sm" href="/delete_unit/{{o.id}}">🗑</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="12" class="text-center text-muted py-3">No UNIT found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
